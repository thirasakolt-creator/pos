<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งซ่อม - มณีจันทร์</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<style>
  :root {
    --primary: #0f766e;
    --primary-dark: #0d5c56;
    --bg: #f4f6f7;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #dc2626;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Sarabun', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .login-card h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--primary-dark);
  }
  .login-card p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--text);
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: var(--primary-dark); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #error-msg {
    color: var(--danger);
    font-size: 14px;
    margin-bottom: 12px;
    display: none;
  }
  #app-screen { display: none; min-height: 100vh; }
  header.topbar {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  header.topbar .left { display: flex; align-items: center; gap: 12px; }
  .hamburger-btn {
    width: auto; background: none; border: none; color: #fff;
    font-size: 24px; line-height: 1; cursor: pointer; padding: 4px;
  }
  header.topbar .who { font-size: 14px; opacity: 0.9; }
  header.topbar h2 { margin: 0; font-size: 17px; }
  header.topbar button.logout {
    width: auto;
    background: rgba(255,255,255,0.15);
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
  }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .welcome-card {
    background: var(--card); border-radius: 14px; padding: 24px 20px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .welcome-card .big { font-size: 40px; margin-bottom: 8px; }

  /* --- sidebar --- */
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 200; display: none;
  }
  .sidebar-overlay.open { display: block; }
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100%;
    width: 60%; max-width: 320px; min-width: 240px;
    background: var(--card); z-index: 201;
    transform: translateX(-100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
  }
  #sidebar.open { transform: translateX(0); }
  .sidebar-head {
    background: var(--primary); color: #fff; padding: 22px 18px;
  }
  .sidebar-head .sname { font-size: 16px; font-weight: 700; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; font-size: 15px; color: var(--text);
    cursor: pointer; border-bottom: 1px solid var(--bg);
  }
  .sidebar-item .icon { font-size: 20px; width: 24px; text-align: center; }
  .sidebar-foot { padding: 14px 18px; border-top: 1px solid var(--border); }
  .sidebar-foot button.logout {
    width: 100%; background: var(--bg); color: var(--text);
    padding: 12px; font-size: 14px; font-weight: 600;
  }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>ระบบแจ้งซ่อม</h1>
    <p class="sub">โรงแรมมณีจันทร์</p>
    <div id="error-msg"></div>
    <form id="login-form">
      <label for="email">ชื่อผู้ใช้งาน</label>
      <input type="text" id="email" required autocomplete="username" placeholder="เช่น somchai">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="login-btn">เข้าสู่ระบบ</button>
    </form>
    <button type="button" onclick="location.href='report.html'" style="margin-top:10px; background:transparent; border:1px solid var(--border); color:var(--text);">
      แจ้งซ่อม (ไม่ต้อง login)
    </button>
  </div>
</div>

<div id="app-screen">
  <header class="topbar">
    <div class="left">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="เมนู">☰</button>
      <h2 id="topbar-title">ระบบแจ้งซ่อม</h2>
    </div>
  </header>
  <main>
    <div class="welcome-card">
      <div class="big">👋</div>
      สวัสดี <b id="user-name">-</b><br>
      <span id="user-role">-</span><br><br>
      แตะ ☰ มุมซ้ายบนเพื่อเปิดเมนู
    </div>
  </main>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div id="sidebar">
  <div class="sidebar-head">
    <div class="sname" id="sidebar-name">-</div>
    <div class="role-badge" id="sidebar-role" style="display:inline-block; background:rgba(255,255,255,0.2); padding:3px 10px; border-radius:20px; font-size:12px; margin-top:4px;">-</div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-foot">
    <button class="logout" id="logout-btn">ออกจากระบบ</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ตั้งค่า Supabase project ของคุณตรงนี้
  const SUPABASE_URL = 'https://zboyurgqktcwusmamkjl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpib3l1cmdxa3Rjd3VzbWFta2psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODc1OTIsImV4cCI6MjEwNTE2MzU5Mn0.TouB1KptqkZCgl-lXL_AXu2JS7H8ok-LP6IcEqMm7DY';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const LOGIN_DOMAIN = '@m.com';

  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const errorMsg = document.getElementById('error-msg');
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');

  // เมนูตาม role
  const MENUS = {
    admin: [
      { icon: '📋', label: 'งานแจ้งซ่อมทั้งหมด', href: 'tickets.html' },
      { icon: '🧑‍🔧', label: 'มอบหมายงาน', href: 'projects.html' },
      { icon: '💧', label: 'Routine', href: 'routine.html' },
      { icon: '📈', label: 'รายงาน Routine', href: 'routine-report.html' },
      { icon: '👥', label: 'จัดการผู้ใช้งาน', href: 'users.html' },
      { icon: '🏢', label: 'จัดการแผนก' },
      { icon: '🔧', label: 'จัดการประเภทปัญหา' },
      { icon: '📊', label: 'รายงาน KPI ช่าง' },
    ],
    supervisor: [
      { icon: '📋', label: 'งานแจ้งซ่อมทั้งหมด', href: 'tickets.html' },
      { icon: '🧑‍🔧', label: 'มอบหมายงาน', href: 'projects.html' },
      { icon: '💧', label: 'Routine', href: 'routine.html' },
      { icon: '📈', label: 'รายงาน Routine', href: 'routine-report.html' },
      { icon: '👥', label: 'เพิ่มผู้ใช้งาน', href: 'users.html' },
      { icon: '📊', label: 'รายงาน KPI ช่าง' },
    ],
    technician: [
      { icon: '🛠️', label: 'งานของฉัน', href: 'tickets.html' },
      { icon: '💧', label: 'Routine', href: 'routine.html' },
      { icon: '✅', label: 'ปิดงาน', href: 'tickets.html' },
    ],
  };

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  const sidebarEl = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  function openSidebar() {
    sidebarEl.classList.add('open');
    sidebarOverlay.classList.add('open');
  }
  function closeSidebar() {
    sidebarEl.classList.remove('open');
    sidebarOverlay.classList.remove('open');
  }
  document.getElementById('hamburger-btn').addEventListener('click', openSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  function renderMenu(role) {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';
    const items = MENUS[role] || [];
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'sidebar-item';
      div.innerHTML = `<span class="icon">${item.icon}</span>${item.label}`;
      div.onclick = () => {
        closeSidebar();
        if (item.href) { location.href = item.href; }
        else { alert(item.label + ' (กำลังพัฒนาในเฟสถัดไป)'); }
      };
      nav.appendChild(div);
    });
  }

  const ROLE_LABEL = { admin: 'แอดมิน', supervisor: 'หัวหน้าช่าง', technician: 'ช่างเทคนิค' };

  async function loadProfileAndShowApp(authUser) {
    // จับคู่ auth user กับตาราง users ด้วย email
    const { data, error } = await sb
      .from('users')
      .select('name, role, active')
      .ilike('email', authUser.email)
      .single();

    if (error || !data) {
      showError('ไม่พบบัญชีนี้ในระบบ กรุณาติดต่อแอดมิน');
      await sb.auth.signOut();
      return;
    }
    if (!data.active) {
      showError('บัญชีนี้ถูกระงับการใช้งาน');
      await sb.auth.signOut();
      return;
    }

    document.getElementById('user-name').textContent = data.name;
    document.getElementById('user-role').textContent = ROLE_LABEL[data.role] || data.role;
    document.getElementById('sidebar-name').textContent = data.name;
    document.getElementById('sidebar-role').textContent = ROLE_LABEL[data.role] || data.role;
    renderMenu(data.role);
    sessionStorage.setItem('role', data.role);
    sessionStorage.setItem('name', data.name);

    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';

    const rawInput = document.getElementById('email').value.trim().toLowerCase();
    const email = rawInput.includes('@') ? rawInput : rawInput + LOGIN_DOMAIN;
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = 'เข้าสู่ระบบ';

    if (error) {
      showError('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
      return;
    }
    await loadProfileAndShowApp(data.user);
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    sessionStorage.clear();
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  });

  // เช็ค session ที่ค้างไว้ตอนเปิดแอปใหม่
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      await loadProfileAndShowApp(session.user);
    }
  })();

  // ลงทะเบียน service worker สำหรับ PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
